# Checks every push: tests, type check, web build and the Rust side.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  # board mode (Screenboard) in a real browser
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub's Ubuntu runners already have Google Chrome, so no browser download is needed
      # a few checks depend on typing and mouse timing, so a slow runner gets one retry
      - run: npm run test:board || npm run test:board
        env:
          SB_CHROME: /usr/bin/google-chrome

  desktop-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: cargo check (Windows)
        shell: bash
        run: mkdir -p dist && cd src-tauri && cargo check
