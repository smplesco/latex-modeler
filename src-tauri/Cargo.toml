[package]
name = "latex-modeler"
version = "0.1.0"
description = "3D LaTeX page designer with an automatic equation modeller"
authors = ["smplesco"]
edition = "2021"
publish = false

[lib]
name = "latex_modeler_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
